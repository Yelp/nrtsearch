# Prevent Akka's CoordinatedShutdown from calling System.exit() when S3Mock
# shuts down, which would kill the Gradle test worker JVM before it can write
# XML test result files.
akka.coordinated-shutdown.exit-jvm = off
akka.coordinated-shutdown.default-phase-timeout = 1s
akka.http.server.idle-timeout = 5s
akka.http.server.request-timeout = 5s
akka.http.server.bind-timeout = 3s
