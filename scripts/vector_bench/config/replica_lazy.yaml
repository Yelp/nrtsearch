# Isolated replica with lazy remote data: polls S3 for new index versions, and leaves full
# precision vectors (.vec) in S3, reading blocks of them by range when rescoring.
# ${...} values are filled in by cluster.sh.
nodeName: "bench_replica_lazy"
hostName: "localhost"
port: ${LAZY_PORT}
replicationPort: ${LAZY_REPLICATION_PORT}
stateDir: "${BENCH_HOME}/replica_lazy/state"
indexDir: "${BENCH_HOME}/replica_lazy/index"
bucketName: "${BENCH_BUCKET}"
serviceName: "${BENCH_SERVICE}"
stateConfig:
  backendType: REMOTE
  remote:
    readOnly: true
indexStartConfig:
  autoStart: true
  mode: REPLICA
  dataLocationType: REMOTE
isolatedReplicaConfig:
  enabled: true
  pollingIntervalSeconds: ${POLL_SECONDS}
lazyRemoteData:
  enabled: true
  extensions: [vec]
  cacheType: ${CACHE_TYPE}
  cacheSizeMB: ${CACHE_SIZE_MB}
  blockSizeKB: ${BLOCK_SIZE_KB}
threadPoolConfiguration:
  search:
    maxThreads: 16
